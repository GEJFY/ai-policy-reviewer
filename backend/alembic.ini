# Alembic Configuration
# データベースマイグレーション設定

[alembic]
# マイグレーションスクリプトのパス
script_location = alembic

# マイグレーションファイルの命名規則
file_template = %%(rev)s_%%(slug)s

# prepend_sys_path に現在のディレクトリを追加
prepend_sys_path = .

# sqlalchemy.url は env.py で Settings から動的に設定
# sqlalchemy.url = sqlite:///./data/policy_review.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
