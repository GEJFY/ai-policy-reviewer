[pytest]
# テスト設定
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncioモード
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 出力設定
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# マーカー定義
markers =
    slow: 実行に時間がかかるテスト
    integration: 外部サービス連携テスト
    unit: ユニットテスト

# 警告フィルター
filterwarnings =
    ignore::DeprecationWarning:pydantic.*:
    ignore::DeprecationWarning:sqlalchemy.*:

# ログ設定
log_cli = false
log_cli_level = INFO
