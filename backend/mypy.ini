[mypy]
python_version = 3.11
plugins = sqlalchemy.ext.mypy.plugin

# Basic settings
ignore_missing_imports = True
warn_return_any = False
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = False
check_untyped_defs = True

# Exclude alembic migrations
exclude = alembic/

# SQLAlchemy Column[T] vs T false positives per module
[mypy-app.api.reviews]
disable_error_code = arg-type, assignment

[mypy-app.api.terms]
disable_error_code = arg-type, assignment

[mypy-app.api.findings]
disable_error_code = assignment

[mypy-app.api.documents]
disable_error_code = arg-type, assignment

[mypy-app.api.export]
disable_error_code = arg-type, assignment, call-overload

[mypy-app.services.review_engine]
disable_error_code = arg-type, assignment, misc, list-item, return-value, union-attr

[mypy-app.services.vector_store]
disable_error_code = arg-type

[mypy-app.api.document_groups]
disable_error_code = arg-type, assignment

[mypy-app.services.term_extraction_service]
disable_error_code = return-value, misc

[mypy-app.db.seed_data]
disable_error_code = index
