name: CD - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.2.0)'
        required: true
        type: string
      strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - blue-green
          - rolling
        default: blue-green
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # =============================================================================
  # Pre-deployment Validation
  # =============================================================================
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Verify tag exists
        run: |
          git fetch --tags
          if ! git tag -l | grep -q "^${{ inputs.version }}$"; then
            echo "Error: Tag ${{ inputs.version }} does not exist"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v --tb=short -x

  # =============================================================================
  # Build & Push Images
  # =============================================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() && (needs.validate.result == 'success' || inputs.skip_tests) }}
    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', inputs.version) }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy (Blue-Green)
  # =============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy (Blue-Green)
        if: inputs.strategy == 'blue-green'
        run: |
          # 現在のアクティブなデプロイメントを確認
          CURRENT=$(kubectl get svc policy-reviewer-backend -n production -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")

          if [ "$CURRENT" == "blue" ]; then
            NEW="green"
          else
            NEW="blue"
          fi

          echo "Current: $CURRENT, Deploying to: $NEW"

          # 新バージョンをデプロイ
          helm upgrade --install policy-reviewer-$NEW charts/policy-reviewer \
            --namespace production \
            --set backend.image.tag=${{ inputs.version }} \
            --set frontend.image.tag=${{ inputs.version }} \
            --set global.version=$NEW \
            --wait --timeout 10m

      - name: Deploy (Rolling)
        if: inputs.strategy == 'rolling'
        run: |
          helm upgrade --install policy-reviewer charts/policy-reviewer \
            --namespace production \
            --set backend.image.tag=${{ inputs.version }} \
            --set frontend.image.tag=${{ inputs.version }} \
            --wait --timeout 10m

  # =============================================================================
  # Smoke Tests
  # =============================================================================
  smoke-test:
    name: Post-deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          # ヘルスチェック
          for i in {1..10}; do
            if curl -sf "${{ secrets.PROD_API_URL }}/health/ready"; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for service to be ready..."
            sleep 10
          done

          # 基本的なAPIテスト
          curl -sf "${{ secrets.PROD_API_URL }}/api/v1/terms" || exit 1
          echo "Smoke tests passed"

  # =============================================================================
  # Rollback (on failure)
  # =============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()

    steps:
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Rollback deployment
        run: |
          echo "Rolling back to previous version..."
          kubectl rollout undo deployment/policy-reviewer-backend -n production
          kubectl rollout undo deployment/policy-reviewer-frontend -n production

          # ロールバック完了を待機
          kubectl rollout status deployment/policy-reviewer-backend -n production --timeout=5m

      - name: Notify rollback
        run: |
          echo "::error::Deployment failed and was rolled back"
