name: CD - AWS (ECS Fargate)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.2.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================================
  # Pre-deployment Validation
  # =============================================================================
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v --tb=short -x

  # =============================================================================
  # Build & Push to ECR
  # =============================================================================
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() && (needs.validate.result == 'success' || inputs.skip_tests) }}

    outputs:
      backend_image: ${{ steps.build-backend.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: policy-reviewer-${{ inputs.environment }}-backend
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: policy-reviewer-${{ inputs.environment }}-frontend
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # =============================================================================
  # Deploy to ECS
  # =============================================================================
  deploy:
    name: Deploy to ECS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: aws-${{ inputs.environment }}
    concurrency:
      group: aws-${{ inputs.environment }}-deployment
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service (rolling deploy)
        run: |
          CLUSTER="policy-reviewer-${{ inputs.environment }}-cluster"
          SERVICE="policy-reviewer-${{ inputs.environment }}-backend"

          # タスク定義を新しいイメージで更新
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition policy-reviewer-${{ inputs.environment }}-backend \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "${{ needs.build-push.outputs.backend_image }}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF"

          # サービスを更新
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment

          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services $SERVICE

  # =============================================================================
  # Smoke Tests
  # =============================================================================
  smoke-test:
    name: Post-deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          ALB_URL="${{ secrets.AWS_ALB_URL }}"
          for i in {1..10}; do
            if curl -sf "$ALB_URL/health/ready"; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for service to be ready..."
            sleep 15
          done

          curl -sf "$ALB_URL/api/v1/terms" || exit 1
          echo "Smoke tests passed"

  # =============================================================================
  # Rollback on Failure
  # =============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback ECS service
        run: |
          CLUSTER="policy-reviewer-${{ inputs.environment }}-cluster"
          SERVICE="policy-reviewer-${{ inputs.environment }}-backend"

          # 前のタスク定義にロールバック
          PREV_TASK_DEF=$(aws ecs describe-services \
            --cluster $CLUSTER \
            --services $SERVICE \
            --query 'services[0].deployments[?status==`ACTIVE`].taskDefinition' \
            --output text)

          if [ -n "$PREV_TASK_DEF" ]; then
            aws ecs update-service \
              --cluster $CLUSTER \
              --service $SERVICE \
              --task-definition $PREV_TASK_DEF \
              --force-new-deployment
            echo "Rolled back to: $PREV_TASK_DEF"
          else
            echo "::error::No previous task definition found for rollback"
          fi
