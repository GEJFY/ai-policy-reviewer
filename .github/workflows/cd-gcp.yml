name: CD - GCP (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.2.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        type: boolean
        default: false

env:
  GCP_REGION: asia-northeast1

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================================
  # Pre-deployment Validation
  # =============================================================================
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v --tb=short -x

  # =============================================================================
  # Build & Push to Artifact Registry
  # =============================================================================
  build-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() && (needs.validate.result == 'success' || inputs.skip_tests) }}

    outputs:
      backend_image: ${{ steps.build-backend.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push backend
        id: build-backend
        env:
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/policy-reviewer-${{ inputs.environment }}-docker
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          docker build -t $REGISTRY/backend:$IMAGE_TAG ./backend
          docker push $REGISTRY/backend:$IMAGE_TAG
          echo "image=$REGISTRY/backend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        env:
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/policy-reviewer-${{ inputs.environment }}-docker
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          docker build -t $REGISTRY/frontend:$IMAGE_TAG ./frontend
          docker push $REGISTRY/frontend:$IMAGE_TAG

  # =============================================================================
  # Deploy to Cloud Run
  # =============================================================================
  deploy:
    name: Deploy to Cloud Run (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: gcp-${{ inputs.environment }}
    concurrency:
      group: gcp-${{ inputs.environment }}-deployment
      cancel-in-progress: false

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: policy-reviewer-${{ inputs.environment }}-backend
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build-push.outputs.backend_image }}

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe \
            policy-reviewer-${{ inputs.environment }}-backend \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $URL"

  # =============================================================================
  # Smoke Tests
  # =============================================================================
  smoke-test:
    name: Post-deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Run smoke tests
        run: |
          BACKEND_URL=$(gcloud run services describe \
            policy-reviewer-${{ inputs.environment }}-backend \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')

          for i in {1..10}; do
            if curl -sf "$BACKEND_URL/health/ready"; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for service to be ready..."
            sleep 10
          done

          curl -sf "$BACKEND_URL/api/v1/terms" || exit 1
          echo "Smoke tests passed"

  # =============================================================================
  # Rollback on Failure
  # =============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Rollback to previous revision
        run: |
          SERVICE="policy-reviewer-${{ inputs.environment }}-backend"
          REGION="${{ env.GCP_REGION }}"

          # 前のリビジョンを取得
          REVISIONS=$(gcloud run revisions list \
            --service $SERVICE \
            --region $REGION \
            --format 'value(REVISION)' \
            --limit 2)

          PREV_REVISION=$(echo "$REVISIONS" | tail -1)

          if [ -n "$PREV_REVISION" ]; then
            gcloud run services update-traffic $SERVICE \
              --region $REGION \
              --to-revisions $PREV_REVISION=100
            echo "Rolled back to: $PREV_REVISION"
          else
            echo "::error::No previous revision found for rollback"
          fi
